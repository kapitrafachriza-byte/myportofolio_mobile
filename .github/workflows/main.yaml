name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@v2
    with:
      setup: dart run build_runner build --delete-conflicting-outputs
      coverage_excludes: "**/*.g.dart"
      min_coverage: 0
      timeout_minutes: 15

  build_apk:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Accept Android SDK licenses
        run: yes | flutter doctor --android-licenses || true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Build release APK
        run: |
          set +e
          if [ -n "${{ vars.API_BASE_URL }}" ]; then
            flutter build apk --release --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }} 2>&1 | tee apk_build.log
          else
            flutter build apk --release 2>&1 | tee apk_build.log
          fi
          EXIT_CODE=${PIPESTATUS[0]}
          if [ $EXIT_CODE -ne 0 ]; then
            TAIL=$(tail -n 35 apk_build.log | python3 -c "import sys; print(sys.stdin.read().replace('%', '%25').replace('\r', '').replace('\n', '%0A'))")
            echo "::error::$TAIL"
          fi
          exit $EXIT_CODE
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
