name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@v2
    with:
      setup: dart run build_runner build --delete-conflicting-outputs
      coverage_excludes: "**/*.g.dart"
      min_coverage: 0
      timeout_minutes: 15

  build_apk:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Accept Android SDK licenses
        run: yes | flutter doctor --android-licenses || true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: |
          if [ -n "${{ vars.API_BASE_URL }}" ]; then
            flutter build apk --release --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}
          else
            flutter build apk --release
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
